name: Feature request
description: Suggest a focused product or engineering improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user need or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy, performance, or model implications
      description: Note external services, camera/media changes, GPU needs, or license constraints.
    validations:
      required: true
